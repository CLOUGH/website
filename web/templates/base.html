{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <meta name="description" content="{{.meta.description}}">
    <meta name="keywords" content="{{.meta.keywords}}">
    
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Custom CSS Variables for Modern Dark Theme -->
    <style>
        :root {
            --background: 0.97 0.005 240;
            --foreground: 0.25 0.02 240;
            --card: 1 0 0;
            --card-foreground: 0.25 0.02 240;
            --primary: 0.65 0.15 195;
            --primary-foreground: 0.98 0.005 240;
            --secondary: 0.92 0.01 240;
            --secondary-foreground: 0.25 0.02 240;
            --muted: 0.55 0.02 240;
            --muted-foreground: 0.55 0.02 240;
            --accent: 0.65 0.15 195;
            --accent-foreground: 0.98 0.005 240;
            --border: 0.88 0.01 240;
            --input: 0.88 0.01 240;
            --ring: 0.65 0.15 195;
            --radius: 0.5rem;
        }

        .dark {
            --background: 0.15 0.02 240;
            --foreground: 0.85 0.01 240;
            --card: 0.18 0.02 240;
            --card-foreground: 0.85 0.01 240;
            --primary: 0.65 0.15 195;
            --primary-foreground: 0.15 0.02 240;
            --secondary: 0.25 0.02 240;
            --secondary-foreground: 0.85 0.01 240;
            --muted: 0.55 0.02 240;
            --muted-foreground: 0.55 0.02 240;
            --accent: 0.65 0.15 195;
            --accent-foreground: 0.15 0.02 240;
            --border: 0.25 0.02 240;
            --input: 0.25 0.02 240;
            --ring: 0.65 0.15 195;
        }

        .bg-background { background-color: oklch(var(--background)); }
        .text-foreground { color: oklch(var(--foreground)); }
        .bg-card { background-color: oklch(var(--card)); }
        .text-card-foreground { color: oklch(var(--card-foreground)); }
        .bg-primary { background-color: oklch(var(--primary)); }
        .text-primary { color: oklch(var(--primary)); }
        .text-primary-foreground { color: oklch(var(--primary-foreground)); }
        .bg-secondary { background-color: oklch(var(--secondary)); }
        .text-secondary-foreground { color: oklch(var(--secondary-foreground)); }
        .text-muted-foreground { color: oklch(var(--muted-foreground)); }
        .bg-accent { background-color: oklch(var(--accent)); }
        .text-accent-foreground { color: oklch(var(--accent-foreground)); }
        .border-border { border-color: oklch(var(--border)); }
        .bg-input { background-color: oklch(var(--input)); }
        .ring-ring { --tw-ring-color: oklch(var(--ring)); }
    </style>
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: 'oklch(var(--background))',
                        foreground: 'oklch(var(--foreground))',
                        card: {
                            DEFAULT: 'oklch(var(--card))',
                            foreground: 'oklch(var(--card-foreground))',
                        },
                        primary: {
                            DEFAULT: 'oklch(var(--primary))',
                            foreground: 'oklch(var(--primary-foreground))',
                        },
                        secondary: {
                            DEFAULT: 'oklch(var(--secondary))',
                            foreground: 'oklch(var(--secondary-foreground))',
                        },
                        muted: {
                            DEFAULT: 'oklch(var(--muted))',
                            foreground: 'oklch(var(--muted-foreground))',
                        },
                        accent: {
                            DEFAULT: 'oklch(var(--accent))',
                            foreground: 'oklch(var(--accent-foreground))',
                        },
                        border: 'oklch(var(--border))',
                        input: 'oklch(var(--input))',
                        ring: 'oklch(var(--ring))',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="manifest" href="/manifest.json">
</head>
<body class="dark bg-background text-foreground font-sans antialiased">
    <!-- Fixed Sidebar Navigation -->
    <nav class="fixed left-0 top-0 hidden h-screen w-80 flex-col justify-between p-12 lg:flex">
        <div>
            <h1 class="mb-2 text-5xl font-bold tracking-tight text-foreground">Warren Clough</h1>
            <h2 class="mb-4 text-xl font-medium text-primary">Full Stack Developer</h2>
            <p class="mb-12 text-muted-foreground leading-relaxed">
                I build exceptional digital experiences that blend beautiful design with powerful functionality.
            </p>

            <ul class="space-y-4">
                <li>
                    <a href="/portfolio" class="group flex items-center gap-3 text-sm font-medium uppercase tracking-widest transition-all">
                        <span class="h-px w-8 bg-muted-foreground group-hover:w-16 group-hover:bg-foreground transition-all"></span>
                        <span class="text-muted-foreground group-hover:text-foreground transition-colors">Portfolio</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="flex gap-6">
            <a href="https://github.com/warrenclough" target="_blank" rel="noopener noreferrer" class="text-muted-foreground transition-colors hover:text-primary" aria-label="GitHub">
                <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
            </a>
            <a href="https://linkedin.com/in/warrenclough" target="_blank" rel="noopener noreferrer" class="text-muted-foreground transition-colors hover:text-primary" aria-label="LinkedIn">
                <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
            </a>
            <a href="mailto:warren@warrenclough.com" class="text-muted-foreground transition-colors hover:text-primary" aria-label="Email">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
            </a>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main class="lg:ml-80">
        {{template "content" .}}
    </main>
</body>
</html>
{{end}}
