{{define "admin/login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK compat mode for better browser support -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script>
        // Firebase config - loaded from environment variables
        const firebaseConfig = {
            apiKey: "{{.FirebaseConfig.APIKey}}",
            authDomain: "{{.FirebaseConfig.AuthDomain}}",
            projectId: "{{.FirebaseConfig.ProjectID}}",
            storageBucket: "{{.FirebaseConfig.StorageBucket}}",
            messagingSenderId: "{{.FirebaseConfig.MessagingSenderID}}",
            appId: "{{.FirebaseConfig.AppID}}"
        };
        
        // Initialize Firebase
        if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "" && !firebaseConfig.apiKey.includes("Dummy")) {
            firebase.initializeApp(firebaseConfig);
        } else {
            console.error('Firebase configuration is missing or using dummy values.');
            document.getElementById('error-message').innerHTML = 
                'Firebase configuration is incomplete.<br><br>' +
                '<strong>To fix this:</strong><br>' +
                '1. Get your Firebase web app config from Firebase Console<br>' +
                '2. Update your .env file with real values<br>' +
                '3. Restart the server<br><br>' +
                '<a href="https://console.firebase.google.com/project/my-website-a3970" target="_blank" class="text-blue-600 underline">Open Firebase Console</a>';
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('login-form').style.display = 'none';
        }
    </script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
            Admin Access
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
            Sign in with your Google account to manage content
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
            <div id="login-form">
                <button
                    onclick="signInWithGoogle()"
                    class="w-full flex justify-center items-center px-4 py-3 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    <img class="w-5 h-5 mr-3" src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo">
                    Sign in with Google
                </button>
            </div>

            <div id="loading" class="hidden text-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
                <p class="mt-2 text-sm text-gray-600">Signing you in...</p>
            </div>

            <div id="error" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-md">
                <p class="text-sm text-red-600" id="error-message"></p>
            </div>
        </div>
    </div>

    <script>
        async function signInWithGoogle() {
            const loginForm = document.getElementById('login-form');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            
            try {
                loginForm.classList.add('hidden');
                loading.classList.remove('hidden');
                error.classList.add('hidden');

                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('email');
                provider.addScope('profile');
                
                const result = await firebase.auth().signInWithPopup(provider);
                
                // Get the ID token
                const idToken = await result.user.getIdToken();
                
                // Send token to backend for verification
                const response = await fetch('/admin/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ idToken: idToken })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.isAdmin) {
                        // Store the token for authenticated requests
                        localStorage.setItem('firebaseToken', idToken);
                        localStorage.setItem('userEmail', data.email);
                        localStorage.setItem('userName', data.name);
                        window.location.href = '/admin/dashboard';
                    } else {
                        throw new Error('You do not have admin privileges');
                    }
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Authentication failed');
                }
                
            } catch (err) {
                console.error('Sign-in error:', err);
                document.getElementById('error-message').textContent = err.message;
                error.classList.remove('hidden');
                loginForm.classList.remove('hidden');
                loading.classList.add('hidden');
            }
        }

        // Check if already signed in
        firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const idToken = await user.getIdToken();
                    const response = await fetch('/admin/auth', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ idToken: idToken })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.isAdmin) {
                            // Store the token for authenticated requests
                            localStorage.setItem('firebaseToken', idToken);
                            localStorage.setItem('userEmail', data.email);
                            localStorage.setItem('userName', data.name);
                            window.location.href = '/admin/dashboard';
                        }
                    }
                } catch (err) {
                    console.error('Auto-login error:', err);
                }
            }
        });
    </script>
</body>
</html>
{{end}}
