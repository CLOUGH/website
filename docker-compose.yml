# Docker Compose for Local Development

version: '3.8'

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
      - GIN_MODE=debug
      - PORT=8080
    volumes:
      # Mount credentials file
      - ./your-firebase-key.json:/app/credentials.json:ro
      # Mount source code for hot reload (development only)
      - ./web:/app/web:ro
    restart: unless-stopped
    depends_on:
      - firestore-emulator
    networks:
      - website-network

  # Firebase Firestore Emulator for local development
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
    command: >
      sh -c "
        firebase --version &&
        firebase emulators:start --only firestore --host 0.0.0.0 --project demo-project
      "
    ports:
      - "8080:8080"  # Firestore emulator
      - "4000:4000"  # Emulator UI
    environment:
      - FIRESTORE_EMULATOR_HOST=0.0.0.0:8080
    volumes:
      - ./firebase.json:/workspace/firebase.json:ro
      - ./firestore.rules:/workspace/firestore.rules:ro
      - ./firestore.indexes.json:/workspace/firestore.indexes.json:ro
    working_dir: /workspace
    networks:
      - website-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - website-network

  # Nginx for reverse proxy and static file serving (production-like setup)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web/static:/var/www/static:ro
      - ./docker/ssl:/etc/nginx/ssl:ro  # For SSL certificates
    depends_on:
      - website
    networks:
      - website-network

volumes:
  redis-data:

networks:
  website-network:
    driver: bridge